name: Build HTML5
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and assets
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Install dependencies
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          U="https://github"
          P=".com/FunkinCrew"
          haxelib git haxelib "${U}${P}/haxelib.git"
          haxelib git hmm "${U}${P}/hmm.git"
          haxelib run hmm install

      - name: Build HTML5
        run: haxelib run lime build html5 -DGITHUB_BUILD

      - name: Upload HTML5 build
        uses: actions/upload-artifact@v4
        with:
          name: fnf-html5
          path: export/release/html5/bin
