name: Build and Deploy HTML5
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and assets
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Cache Haxelib dependencies
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-${{ hashFiles('hmm.json') }}-v6

      - name: Install dependencies cleanly
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          U="https://github"
          P=".com/FunkinCrew"
          haxelib git haxelib "${U}${P}/haxelib.git"
          haxelib git hmm "${U}${P}/hmm.git"
          haxelib run hmm install
          # Install official lime into an isolated temp haxelib folder and grab lime.ndll
          mkdir -p /tmp/haxelib
          HAXELIB_PATH=/tmp/haxelib haxelib install lime --always
          mkdir -p .haxelib/lime/git/ndll/Linux64
          cp -r /tmp/haxelib/lime/*/ndll/Linux64/* .haxelib/lime/git/ndll/Linux64/

      - name: Build HTML5
        run: haxelib run lime build html5 -DGITHUB_BUILD

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/release/html5/bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
